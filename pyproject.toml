[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperguard-backend"
version = "0.1.0"
description = "FastAPI backend for PaperGuard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  "APScheduler>=3.10,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
include = ["app*", "rules*"]
exclude = ["tests*", "tmp*"]

[tool.setuptools.package-data]
rules = ["*.json"]

